name: PHP checks
on:
  push:
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - name: Lint PHP
        run: find modules tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit checks
        run: php tests/validation_test.php

  mysql-contract:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: quran_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - name: Test MySQL schema and data roundtrip
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: quran_test
          MYSQL_USER: root
          MYSQL_PASSWORD: test_password
        run: php tests/schema_mysql_test.php
